<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="text-white text-center text-bold py-3 fixed-top tape">
        <i class="bi bi-gift me-2"></i>New to Netflix? Try 14 days for EGP 0.
    </div>
    <div class="back">
        <img src="assets\imgi_6_EG-en-20260803-TRIFECTA-perspective_d8266373-8c59-47ed-9d6c-d86bedca9ac8_small.jpg"
            alt="Netflix Background" class="back_imag">
        <img src="assets\logo.png" alt="Netflix logo" class="logo">


        <div class="firstcard text-center text-white">
            <h2 class="fw-bold mb-4 text-center tit">Sign Up</h2>
            <hr class="my-3 border-secondary">
            <form class="text-start">
                <div class="row">
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">First Name</label>
                        <input type="text" id="firstName" class="form-control custom-input" placeholder="First name">
                    </div>
                    <div class="col-6 mb-3">
                        <label class="form-label fw-bold">Last Name</label>
                        <input type="text" id="lastName" class="form-control custom-input" placeholder="Last name">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Email Address</label>
                    <input type="email" id="email" class="form-control custom-input" placeholder="Enter your email">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" id="password" class="form-control custom-input"
                        placeholder="Create a password">
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Confirm Password</label>
                    <input type="password" id="confirmPassword" class="form-control custom-input"
                        placeholder="Confirm password">
                </div>

                <button type="button" id="signupBtn" class="w-100 py-2 Signup-btn mb-3">
                    Sign Up
                </button>

                <p class="text-center mb-0 text-secondary">
                    Already have an account? <a href="login.html" class="fw-bold login">Log In</a>
                </p>
            </form>
        </div>
    </div>
    <script type="module" src="main.js"></script>
</body>

</html>
